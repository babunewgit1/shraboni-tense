<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শ্রাবণী tense পারে না</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: an exercise book. One narrow column; lessons as a numbered path, practice as one card at a time. */
:root{
  --paper:#f2f5fb; --surface:#ffffff; --ink:#16233f; --muted:#56647f; --line:#d3dbea;
  --accent:#1f4fd1; --accent-soft:#e4ebfd; --on-accent:#ffffff; --margin:#d6455a;
  --good:#17805a; --good-soft:#dff4ea; --bad:#c23434; --bad-soft:#fde6e6; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --display:"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1524; --surface:#182036; --ink:#e8edf8; --muted:#9ba8c4; --line:#2c3757;
  --accent:#86a8ff; --accent-soft:#222f55; --on-accent:#0f1524; --margin:#ff7a8c;
  --good:#55d3a0; --good-soft:#143a2d; --bad:#ff8a8a; --bad-soft:#44201f; --warn:#f0c35a; --warn-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1524; --surface:#182036; --ink:#e8edf8; --muted:#9ba8c4; --line:#2c3757;
  --accent:#86a8ff; --accent-soft:#222f55; --on-accent:#0f1524; --margin:#ff7a8c;
  --good:#55d3a0; --good-soft:#143a2d; --bad:#ff8a8a; --bad-soft:#44201f; --warn:#f0c35a; --warn-soft:#3a2f12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65}
.page{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:2rem}
h2{font-size:1.5rem}
h3{font-size:1.05rem;color:var(--muted);font-family:var(--body);font-weight:600}
p{margin:0}
.sub{color:var(--muted)}
small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:8px;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:2}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.stack{display:flex;flex-direction:column;gap:16px}
.tight{gap:6px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.pick button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;line-height:1.35}
.pick button small{display:block;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick .wide{grid-column:1/-1}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}
.formula span{border:1.5px solid var(--accent);color:var(--accent);border-radius:6px;padding:2px 10px}
.formula i{font-style:normal;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-weight:500;font-size:.95rem}
.ex{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ex li{border-bottom:1px dashed var(--line);padding-bottom:10px}
.ex li:last-child{border-bottom:0;padding-bottom:0}
.en{font-weight:500}
.en b,.blankline b,.bnline b,td b{color:var(--accent);font-weight:600}
.bn{color:var(--muted)}
.notes{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.callout{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.callout strong{font-family:var(--display);font-size:1.05rem}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--accent-soft);font-weight:600;white-space:nowrap}
td.nowrap{white-space:nowrap}
tr.irr td:first-child{color:var(--accent);font-weight:600}
table.chart{min-width:540px}
table.chart td{padding:0}
table.chart td button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 10px;cursor:pointer}
table.chart td button:hover{background:var(--accent-soft)}
table.chart td button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
table.chart .cbn{display:block}
table.chart .cen{display:block;color:var(--muted);font-size:.85rem}

svg.tl{width:100%;max-width:380px;height:auto;display:block}
svg.tl text{fill:var(--muted);font-family:var(--body);font-size:12px}
svg.tl .axis{stroke:var(--line);stroke-width:2;fill:none}
svg.tl .now{stroke:var(--margin);stroke-width:2;fill:none}
svg.tl .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
svg.tl .mark{fill:var(--accent);stroke:var(--accent)}
svg.tl .dash{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4;fill:none}

.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:12px 20px;font-weight:600;align-self:flex-start}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:4px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;align-self:flex-start}

.lgroup{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.lrow .ln{font-family:var(--display);font-size:1.15rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lrow .lt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.lrow .lt small{color:var(--muted)}
.lrow .done{color:var(--good);font-weight:600;font-size:.9rem}
.lrow .start{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.lrow.next{border-color:var(--accent)}

.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter div{height:100%;background:var(--accent);border-radius:4px}
.qtype{font-size:.85rem;font-weight:600;color:var(--margin);letter-spacing:.02em}
.prompt{font-size:1.3rem;font-family:var(--display);line-height:1.45}
.prompt b{color:var(--accent)}
.blankline{font-size:1.15rem;font-weight:500}
.bnline{color:var(--muted)}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 4px}
.opts{display:grid;gap:8px}
.opts button,.tcol button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;text-align:left;font-weight:500;line-height:1.35}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts button.right,.tcol button.right{border-color:var(--good);background:var(--good-soft)}
.opts button.wrong,.tcol button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts button:disabled,.tcol button:disabled{cursor:default}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.tcol .th{font-weight:600;text-align:center;line-height:1.3;padding-bottom:2px}
.tcol .th small{display:block;color:var(--muted);font-weight:400}
.tcol button{padding:10px 8px;text-align:center;font-size:.92rem}
input.fill,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;max-width:340px}
.tray,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;align-items:center}
.built{border-bottom:2px solid var(--line);padding-bottom:8px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:500}
.built .tile{border-color:var(--accent);background:var(--accent-soft)}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb strong{font-family:var(--display);font-size:1.1rem}
.fb.ok strong{color:var(--good)}
.fb.no strong{color:var(--bad)}
.why{display:flex;flex-direction:column;gap:4px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.big{font-family:var(--display);font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.heat td{text-align:center;padding:0}
.heat td button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 6px;cursor:pointer;line-height:1.3}
.heat td button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.heat td small{display:block;color:var(--muted)}
.heat td.lv-good{background:var(--good-soft)}
.heat td.lv-mid{background:var(--warn-soft)}
.heat td.lv-bad{background:var(--bad-soft)}
.heat th:first-child,.heat td:first-child{text-align:left}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding-block:10px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .meter{grid-column:1/-1}
.prow .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.88rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--line)}
.legend .g::before{background:var(--good-soft);border:1px solid var(--good)}
.legend .m::before{background:var(--warn-soft);border:1px solid var(--warn)}
.legend .b::before{background:var(--bad-soft);border:1px solid var(--bad)}
@media (prefers-reduced-motion:no-preference){.meter div{transition:width .3s}}

@media (max-width:560px){
  body{font-size:16px}
  h1{font-size:1.55rem}
  h2{font-size:1.3rem}
  .page{padding-block:14px 40px;gap:16px}
  .sheet{padding:16px;gap:18px}
  .tabs{gap:0}
  .tabs button{flex:1;padding:10px 4px}
  .btn{align-self:stretch;text-align:center;padding:14px 16px}
  .row>.btn{flex:1 1 100%}
  .btn.small{align-self:auto;padding:4px 12px}
  .row>.btn.small{flex:0 0 auto}
  input.fill,select{max-width:none;font-size:16px;padding:12px}
  .opts button{padding:13px 14px}
  .tile{padding:9px 13px}
  .prompt{font-size:1.15rem}
  .blankline{font-size:1.05rem}
  .big{font-size:1.7rem}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pick.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pair{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>

<div class="page">
  <header class="stack tight">
    <h1>শ্রাবণী tense পারে না</h1>
    <p class="sub">একদম শুরু থেকে ১২টি tense: পড়ুন, চিনতে শিখুন, তারপর যত খুশি অনুশীলন করুন।</p>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-learn" data-tab="learn">শিখুন</button>
    <button role="tab" id="tab-practice" data-tab="practice">অনুশীলন</button>
    <button role="tab" id="tab-progress" data-tab="progress">অগ্রগতি</button>
  </nav>
  <main id="view" class="stack"></main>
</div>

<script>
/* ---------- tense names ---------- */
const ASP=['Indefinite','Continuous','Perfect','Perfect Continuous'];
const ASP_BN=['সাধারণ','ঘটমান','পুরাঘটিত','পুরাঘটিত ঘটমান'];
const TIME=['Present','Past','Future'], TIME_BN=['বর্তমান','অতীত','ভবিষ্যৎ'];
const tname=t=>TIME[t>>2]+' '+ASP[t&3];
const tbn=t=>ASP_BN[t&3]+' '+TIME_BN[t>>2];

/* ---------- Bangla verbs: present forms [আমি, তুমি, সে, আপনি] and stems ---------- */
const B={
 'খা':{pr:['খাই','খাও','খায়','খান'],c:'খাচ্ছ',pf:'খেয়ে',ps:'খেল',fu:'খাব',inf:'খেতে'},
 'কর':{pr:['করি','করো','করে','করেন'],c:'করছ',pf:'করে',ps:'করল',fu:'করব',inf:'করতে'},
 'পড়':{pr:['পড়ি','পড়ো','পড়ে','পড়েন'],c:'পড়ছ',pf:'পড়ে',ps:'পড়ল',fu:'পড়ব',inf:'পড়তে'},
 'লিখ':{pr:['লিখি','লেখো','লেখে','লেখেন'],c:'লিখছ',pf:'লিখে',ps:'লিখল',fu:'লিখব',inf:'লিখতে'},
 'খেল':{pr:['খেলি','খেলো','খেলে','খেলেন'],c:'খেলছ',pf:'খেলে',ps:'খেলল',fu:'খেলব',inf:'খেলতে'},
 'দেখ':{pr:['দেখি','দেখো','দেখে','দেখেন'],c:'দেখছ',pf:'দেখে',ps:'দেখল',fu:'দেখব',inf:'দেখতে'},
 'ঘুম':{pr:['ঘুমাই','ঘুমাও','ঘুমায়','ঘুমান'],c:'ঘুমাচ্ছ',pf:'ঘুমিয়ে',ps:'ঘুমাল',fu:'ঘুমাব',inf:'ঘুমাতে'},
 'বানা':{pr:['বানাই','বানাও','বানায়','বানান'],c:'বানাচ্ছ',pf:'বানিয়ে',ps:'বানাল',fu:'বানাব',inf:'বানাতে'},
 'গা':{pr:['গাই','গাও','গায়','গান'],c:'গাইছ',pf:'গেয়ে',ps:'গাইল',fu:'গাইব',inf:'গাইতে'},
 'ধো':{pr:['ধুই','ধোও','ধোয়','ধোন'],c:'ধুচ্ছ',pf:'ধুয়ে',ps:'ধুল',fu:'ধোব',inf:'ধুতে'},
 'শিখ':{pr:['শিখি','শেখো','শেখে','শেখেন'],c:'শিখছ',pf:'শিখে',ps:'শিখল',fu:'শিখব',inf:'শিখতে'},
 'চালা':{pr:['চালাই','চালাও','চালায়','চালান'],c:'চালাচ্ছ',pf:'চালিয়ে',ps:'চালাল',fu:'চালাব',inf:'চালাতে'},
 'পড়া':{pr:['পড়াই','পড়াও','পড়ায়','পড়ান'],c:'পড়াচ্ছ',pf:'পড়িয়ে',ps:'পড়াল',fu:'পড়াব',inf:'পড়াতে'},
 'হাঁট':{pr:['হাঁটি','হাঁটো','হাঁটে','হাঁটেন'],c:'হাঁটছ',pf:'হেঁটে',ps:'হাঁটল',fu:'হাঁটব',inf:'হাঁটতে'},
 'দৌড়':{pr:['দৌড়াই','দৌড়াও','দৌড়ায়','দৌড়ান'],c:'দৌড়াচ্ছ',pf:'দৌড়ে',ps:'দৌড়াল',fu:'দৌড়াব',inf:'দৌড়াতে'},
 'কিন':{pr:['কিনি','কেনো','কেনে','কেনেন'],c:'কিনছ',pf:'কিনে',ps:'কিনল',fu:'কিনব',inf:'কিনতে'},
 'বল':{pr:['বলি','বলো','বলে','বলেন'],c:'বলছ',pf:'বলে',ps:'বলল',fu:'বলব',inf:'বলতে'},
 'যা':{pr:['যাই','যাও','যায়','যান'],c:'যাচ্ছ',pf:'গিয়ে',ps:'গেল',fu:'যাব',inf:'যেতে'},
 'আস':{pr:['আসি','আসো','আসে','আসেন'],c:'আসছ',pf:'এসে',ps:'এল',fu:'আসব',inf:'আসতে'},
 'আঁক':{pr:['আঁকি','আঁকো','আঁকে','আঁকেন'],c:'আঁকছ',pf:'এঁকে',ps:'আঁকল',fu:'আঁকব',inf:'আঁকতে'},
 'শুন':{pr:['শুনি','শোনো','শোনে','শোনেন'],c:'শুনছ',pf:'শুনে',ps:'শুনল',fu:'শুনব',inf:'শুনতে'},
 'কাট':{pr:['কাটি','কাটো','কাটে','কাটেন'],c:'কাটছ',pf:'কেটে',ps:'কাটল',fu:'কাটব',inf:'কাটতে'},
 'খুল':{pr:['খুলি','খোলো','খোলে','খোলেন'],c:'খুলছ',pf:'খুলে',ps:'খুলল',fu:'খুলব',inf:'খুলতে'},
 'বস':{pr:['বসি','বসো','বসে','বসেন'],c:'বসছ',pf:'বসে',ps:'বসল',fu:'বসব',inf:'বসতে'},
 'নাচ':{pr:['নাচি','নাচো','নাচে','নাচেন'],c:'নাচছ',pf:'নেচে',ps:'নাচল',fu:'নাচব',inf:'নাচতে'},

/* ---------- sentence building ---------- */
function enVP(t,s,V){
 const s3=s.ec==='s3', be=s.ec==='I'?'am':s3?'is':'are', was=s.ec==='pl'?'were':'was', hv=s3?'has':'have';
 return [[s3?V.s:V.v],[be,V.ing],[hv,V.v3],[hv,'been',V.ing],[V.v2],[was,V.ing],['had',V.v3],['had','been',V.ing],['will',V.v],['will','be',V.ing],['will','have',V.v3],['will','have','been',V.ing]][t];
}
const cap=w=>w[0].toUpperCase()+w.slice(1);
const lowerSubj=en=>KEEPCAP.includes(en)?en:en[0].toLowerCase()+en.slice(1);
function make(t,s,V,o,m,isQ){
 const vp=enVP(t,s,V), objW=o[1]?o[1].split(' '):[], endM=(m.en&&m.pos!=='mid')?m.en.split(' '):[];
 const subW=s.en.split(' '), sw=subW.length;
 let words,vi=[];
 if(!isQ){
  const v=vp.slice(); if(m.pos==='mid'&&m.en)v.splice(1,0,m.en);
  words=[...subW,...v,...objW,...endM];
  for(let i=0;i<v.length;i++)if(!(m.pos==='mid'&&i===1&&m.en))vi.push(sw+i);
 }else{
  let head,rest;
  if(t===0){head=s.ec==='s3'?'Does':'Do';rest=[V.v]}
  else if(t===4){head='Did';rest=[V.v]}
  else{head=cap(vp[0]);rest=vp.slice(1)}
  const sl=lowerSubj(s.en).split(' ');
  const r2=(m.pos==='mid'&&m.en)?[m.en,...rest]:rest;
  words=[head,...sl,...r2,...objW,...endM];
  vi.push(0);const st=1+sl.length+(r2.length-rest.length);for(let i=0;i<rest.length;i++)vi.push(st+i);
 }
 const bv=(V.pre||'')+bnV(V.b,t,s.p);
 const parts=[];if(m.pos==='pre'&&m.bn)parts.push(m.bn);
 parts.push(s.bn);if(isQ)parts.push('কি');
 if(m.pos!=='pre'&&m.bn)parts.push(m.bn);
 if(o[0])parts.push(o[0]);
 const end=isQ?'?':'।', pe=isQ?'?':'.';
 return {t,s,V,o,m,isQ,vp,words,sw,bv,
  en:words.join(' ')+pe,
  enHtml:words.map((w,i)=>vi.includes(i)?'<b>'+esc(w)+'</b>':esc(w)).join(' ')+pe,
  bn:parts.join(' ')+' '+bv+end,
  bnHtml:esc(parts.join(' '))+' <b>'+esc(bv)+'</b>'+end};
}
function genItem(t,o){
 o=o||{};
 const vs=[3,7,11].includes(t)?VERBS.filter(v=>!v.nd):VERBS, V=rnd(vs);
 const ms=o.noMid?MK[t].filter(m=>m.pos!=='mid'):MK[t];
 return make(t,rnd(S),V,rnd(V.o),rnd(ms),!!o.q);
}

const $=s=>document.querySelector(s);
const bnd=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const bnN=n=>bnd(Number(n).toLocaleString('en-US'));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const chips=a=>`<div class="chips">${a.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
const formula=a=>`<div class="formula">${a.map(p=>`<span>${esc(p)}</span>`).join('<i>+</i>')}</div>`;
const pickW=o=>{const k=Object.keys(o);let r=Math.random()*k.reduce((a,x)=>a+o[x],0);for(const x of k){r-=o[x];if(r<=0)return x}return k[0]};
const regEd=v=>/e$/.test(v)?v+'d':/[^aeiou]y$/.test(v)?v.slice(0,-1)+'ied':v+'ed';

function chSubj(){

 return `
 <div class="sec"><h3>Subject (কর্তা) কী?</h3><p>যে কাজটা করে, সেই হলো subject। বাক্যের শুরুতে থাকে। "<b>রিনা</b> ভাত খায়" বাক্যে subject রিনা।</p></div>

 <div class="scroll"><table><thead><tr><th>Subject</th><th>বাংলা</th><th>Present-এ</th><th>Past-এ</th><th>Perfect-এ</th><th>প্রশ্নে</th></tr></thead><tbody>

 </tbody></table></div></div>

}

 else if(q.type==='iden')body=`<p class="prompt" lang="en">${a?it.enHtml:esc(it.en)}</p>${a?`<p class="bnline">${esc(it.bn)}</p>`:''}${idOpts(q,a)}`;
 else if(q.type==='mcq')body=`<p class="bnline">${it.bnHtml}</p><p class="blankline">${a?it.enHtml:blanked(it,it.sw,it.vp.length)}</p>${strOpts(q,a)}`;
 else if(q.type==='fill')body=`<p class="bnline">${it.bnHtml}</p><p class="blankline">${a?it.enHtml:blanked(it,it.sw,it.vp.length)} <span class="sub">(${it.V.v})</span></p>
  ${a?'':`<input class="fill" id="fill-answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="যেমন: is eating" aria-label="উত্তর লিখুন"><button class="btn" data-check>উত্তর মিলান</button>`}`;
 else if(q.type==='aux')body=`<p class="bnline">${it.bnHtml}</p><p class="blankline">${a?it.enHtml:blanked(it,q.ai,1)}</p>${strOpts(q,a,true)}`;
 else if(q.type==='arr')body=`<p class="prompt">${esc(it.bn)}</p>
  <div class="built" aria-label="আপনার বাক্য">${q.built.map((w,k)=>`<button class="tile" data-un="${k}" ${a?'disabled':''}>${esc(w.x)}</button>`).join('')||'<span class="sub">নিচের শব্দগুলোতে ঠিক ক্রমে চাপ দিন</span>'}</div>
  ${a?'':`<div class="tray">${q.tray.map((w,k)=>`<button class="tile" data-add="${k}">${esc(w.x)}</button>`).join('')}</div>
  <button class="btn" data-check ${q.tray.length?'disabled':''}>উত্তর মিলান</button>`}`;
 else if(q.type==='neg')body=`<p class="prompt" lang="en">${esc(it.en)}</p><p class="bnline">${esc(it.bn)}</p><p class="sub">এই বাক্যটিকে না-বোধক (not দিয়ে) করলে কোনটি ঠিক?</p>${strOpts(q,a)}`;
 else if(q.type==='qf')body=`<p class="prompt" lang="en">${esc(it.en)}</p><p class="bnline">প্রশ্ন: ${esc(q.qit.bn)}</p><p class="sub">এই বাক্যটিকে প্রশ্ন বানালে কোনটি ঠিক?</p>${strOpts(q,a)}`;
 else if(q.type==='vf')body=`<p class="prompt"><b>${q.V.v}</b> (${esc(q.V.bn)})-এর ${VFL[q.k]} কোনটি?</p>${strOpts(q,a,true)}`;
 const fb=a?`<div class="fb ${q.ok?'ok':'no'}" role="status"><strong>${q.ok?'ঠিক হয়েছে':'ঠিক হয়নি'}</strong>
  ${q.type==='neg'||q.type==='qf'?`<div class="en">ঠিক উত্তর: <b>${esc(q.ans)}</b></div>`:''}
  ${!['vf','idbn','iden','neg','qf'].includes(q.type)?`<div class="en">ঠিক উত্তর: ${it.enHtml}</div>`:''}
  ${q.type==='idbn'?`<div class="en">${it.enHtml}</div>`:''}
  <div class="why">${why(q)}</div></div>
  <button class="btn" data-next id="next-btn">${sess.i===N-1?'ফলাফল দেখুন':'পরের প্রশ্ন'}</button>`:'';
 view.innerHTML=`
 <div class="stack tight"><div class="row between"><span class="sub">প্রশ্ন ${bnd(sess.i+1)} / ${bnd(N)} · ঠিক ${bnd(sess.right)}</span><button class="btn ghost small" data-quit>বন্ধ করুন</button></div>
 <div class="meter"><div style="width:${100*(sess.i+(a?1:0))/N}%"></div></div></div>
 <div class="sheet"><div class="qtype">${QH[q.type]}</div>${body}${fb}</div>`;
 const inp=$('#fill-answer');if(inp)inp.focus();
 const nb=$('#next-btn');if(nb)nb.focus({preventScroll:false});
}

/* ---------- progress ---------- */
let askReset=false;
function renderProgress(){
 const tot=Object.values(store.ty).reduce((a,x)=>a+x[1],0)||store.t.reduce((a,x)=>a+x[1],0);
 const cor=Object.values(store.ty).reduce((a,x)=>a+x[0],0)||store.t.reduce((a,x)=>a+x[0],0);
 const lv=t=>{const[c,n]=store.t[t];if(n<5)return'';const p=c/n;return p>=.8?'lv-good':p>=.6?'lv-mid':'lv-bad'};
 view.innerHTML=`
 <div class="stats">
  <div><div class="big">${bnN(tot)}</div><p class="sub">প্রশ্নের উত্তর</p></div>
  <div><div class="big">${tot?bnd(Math.round(100*cor/tot))+'%':'–'}</div><p class="sub">ঠিক হয়েছে</p></div>
  <div><div class="big">${bnd(store.days.length)}</div><p class="sub">দিন অনুশীলন</p></div>
  <div><div class="big">${bnd(store.read.length)}/${bnd(CH.length)}</div><p class="sub">পাঠ পড়া</p></div>
 </div>
 <div class="sec"><h3>১২টি tense-এ কেমন হচ্ছে</h3>
 <div class="scroll"><table class="heat"><thead><tr><th></th>${TIME.map((x,g)=>`<th>${TIME_BN[g]}</th>`).join('')}</tr></thead><tbody>
 ${[0,1,2,3].map(a=>`<tr><th>${ASP_BN[a]}<br><small>${ASP[a]}</small></th>${[0,1,2].map(g=>{const t=g*4+a,[c,n]=store.t[t];return `<td class="${lv(t)}"><button data-practice="mix:t${t}" aria-label="${tname(t)} অনুশীলন">${n?bnd(Math.round(100*c/n))+'%':'–'}<small>${bnd(c)}/${bnd(n)}</small></button></td>`}).join('')}</tr>`).join('')}
 </tbody></table></div>
 <div class="legend"><span class="g">৮০% বা বেশি</span><span class="m">৬০–৭৯%</span><span class="b">৬০%-এর কম</span><span>৫টির কম প্রশ্ন</span></div>
 <p class="sub">কোনো ঘরে চাপ দিলে সেই tense-এর অনুশীলন শুরু হবে।</p></div>
 <div class="sec"><h3>প্রশ্নের ধরন অনুযায়ী</h3><div class="sheet" style="gap:0;padding-block:6px">
 ${Object.keys(TYN).map(k=>{const[c,n]=store.ty[k]||[0,0],p=n?Math.round(100*c/n):0;return `<div class="prow"><span>${TYN[k]}</span><span class="num">${n?bnd(p)+'%':'–'} · ${bnd(c)}/${bnd(n)}</span><div class="meter"><div style="width:${p}%"></div></div></div>`}).join('')}
 </div></div>
 <p class="sub">অগ্রগতি এই ফোন বা কম্পিউটারের ব্রাউজারেই জমা থাকে। অন্য যন্ত্রে খুললে নতুন করে শুরু হবে।</p>
 <div class="row"><button class="btn" data-practice="mix:weak">দুর্বলগুলো অনুশীলন করুন</button><button class="btn ghost" data-reset>${askReset?'নিশ্চিত? আবার চাপ দিন':'সব মুছে নতুন করে শুরু'}</button></div>`;
}

/* ---------- render + events ---------- */
function render(){
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
 if(tab==='learn')lesson?renderLesson():renderIndex();
 else if(tab==='practice')renderPractice();
 else renderProgress();
}
function checkTyped(){
 const q=sess.qs[sess.i];
 if(q.type==='fill'){
  const v=($('#fill-answer').value||'').trim().toLowerCase().replace(/[.?!,]/g,'').replace(/\s+/g,' ').replace(/\blearnt\b/,'learned');
  if(!v)return;
  grade(v===q.ans.toLowerCase());
 }else grade(q.built.map(w=>w.x).join(' ')===q.words.join(' '));
 render();
}
function init(){
 view=$('#view');
 document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(!('reset' in d))askReset=false;
  if(d.tab){tab=d.tab;if(tab==='learn')lesson=null;render();window.scrollTo(0,0)}
  else if(d.open){tab='learn';lesson=d.open;sess=sess&&sess.done?null:sess;render();window.scrollTo(0,0)}
  else if('index' in d){lesson=null;render();window.scrollTo(0,0)}
  else if(d.practice){const[ty,sc]=d.practice.split(':');setup.type=ty;setup.scope=sc;startSession()}
  else if(d.set){const[k,v]=d.set.split(':');setup[k]=k==='len'?+v:v;render()}
  else if('go' in d)startSession();
  else if('quit' in d){sess=null;render();window.scrollTo(0,0)}
  else if(d.tid!==undefined){const q=sess.qs[sess.i];q.pick=+d.tid;grade(q.pick===q.t);render()}
  else if(d.opt!==undefined){const q=sess.qs[sess.i];q.pick=d.opt;grade(q.pick===q.ans);render()}
  else if(d.add!==undefined){const q=sess.qs[sess.i];q.built.push(q.tray.splice(+d.add,1)[0]);render()}
  else if(d.un!==undefined){const q=sess.qs[sess.i];q.tray.push(q.built.splice(+d.un,1)[0]);render()}
  else if('check' in d)checkTyped();
  else if('next' in d){if(sess.i===sess.qs.length-1)sess.done=true;else{sess.i++;sess.answered=false}render();window.scrollTo(0,0)}
  else if('reset' in d){if(askReset){store=fresh();save();askReset=false}else askReset=true;render()}
 });
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fill-answer'){e.preventDefault();checkTyped()}});
 render();
}
if(typeof document!=='undefined')init();
</script>
</body>
</html>
